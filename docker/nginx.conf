# The casino's own container: its files under /casino/ (as the site serves it:
# the portal's nginx passes /casino/ here). Every other path of the site is the
# portal's.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Vite's hashed bundles never change
    location /casino/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # the app: its pages are the router's (/casino/jackpot, /casino/<game id> ...)
    location /casino/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /casino/index.html;
    }

    location = /casino {
        return 301 /casino/$is_args$args;
    }
}
